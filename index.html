<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
		<title>BoeesTrack</title>
		<meta name="theme-color" content="#f8fbfe" />
		<!-- use-credentials: the site is behind Cloudflare Access, which would otherwise bounce the cookie-less manifest request to the login page. -->
		<link rel="manifest" href="/manifest.webmanifest" crossorigin="use-credentials" />
		<link rel="icon" type="image/png" href="/icon-192.png" />
		<link rel="apple-touch-icon" href="/apple-touch-icon.png" />
	</head>

	<body>
		<!--
			THESIS: the notebook is the app. The next empty line of today's page is the add button; slips appear only as pages clipped in for review. Refuses cards, tiles, charts and decoration.
			OWN-WORLD: cool near-white paper, pale blue rules, blue-black ink, one red for the margin line and warnings; Geist at weight 200 for figures and 500 to 600 for emphasis, Geist Mono only for slip references and scanned values.
			STORY: the owner sees today and the month at a glance, logs a spend in seconds, and checks slips against their scanned values before anything counts.
			FIRST VIEWPORT: month and budget line on top, today's spend as one large light figure, then the add line with a smaller slips action, then day pages with hairline rules.
			FORM: custom, bespoke (app screens, Operate mode); no concept roll was run because the owner pinned the direction (CONCEPT.md), with Dime as structure anchor and BalancePro for cleanliness. No seed key.
			FINISH: unreviewed and undocumented is unfinished; this build ends with the finish review, the verdict, and DESIGN.md
		-->
		<div id="root"></div>
		<script type="module" src="/src/react-app/main.tsx"></script>
	</body>
</html>
